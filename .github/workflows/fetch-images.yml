name: Migrar imágenes desde OpenCart

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Volver a descargar todo (--force)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/raw-products.tsv'
      - 'scripts/fetch-images.mjs'
      - 'scripts/build-data.mjs'

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-data.mjs
      - run: node scripts/fetch-images.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit imágenes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/assets data/images-report.json src/data/catalog.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "chore: imágenes migradas desde OpenCart"
          git pull --rebase origin main
          git push
